<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Craft Studios</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2e;
            --accent: #7269ff;
            --accent-hover: #584df1;
            --text-main: #f0f2fe;
            --text-muted: #a0a5c0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(15, 17, 26, 0.9);
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 25px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--text-main);
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .games-section {
            padding: 40px 8%;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 30px;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .card-img {
            width: 100%;
            height: 180px;
            background-color: #2a2e45;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card-body {
            padding: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PixelCraft</div>
        <nav>
            <a href="#games">Games</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Indie Games Built from Scratch</h1>
        <p>Explore original titles, web builds, and experimental prototypes directly in your browser.</p>
    </section>

    <section class="games-section" id="games">
        <div class="section-title">Featured Titles</div>
        <div class="grid" id="gameGrid">
            </div>
    </section>

    <footer>
        <p>&copy; 2026 PixelCraft Studios. All rights reserved.</p>
    </footer>

    <script>
        const games = [
            {
                title: "Cyber Dash",
                description: "A fast-paced endless runner set in a neon neon-drenched city.",
                imageText: "Game Preview 1",
                playUrl: "#"
            },
            {
                title: "Dungeon Crawler",
                description: "Retro grid-based movement exploration game with custom mechanics.",
                imageText: "Game Preview 2",
                playUrl: "#"
            },
            {
                title: "Orbit Defender",
                description: "Arcade shooter where you shield your home planet from incoming meteors.",
                imageText: "Game Preview 3",
                playUrl: "#"
            }
        ];

        const grid = document.getElementById('gameGrid');

        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-img">${game.imageText}</div>
                <div class="card-body">
                    <h2 class="card-title">${game.title}</h2>
                    <p class="card-desc">${game.description}</p>
                    <a href="${game.playUrl}" class="btn">Play Game</a>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
