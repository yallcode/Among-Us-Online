<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plane Gamer</title>
    <style>
        /* This CSS makes the canvas take up the whole screen and styles the text */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2f3542; /* Dark background */
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #gameCanvas {
            display: block;
        }
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 32px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000000;
        }
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to the canvas */
        }
        #message {
            font-size: 40px;
            color: #ffa502; /* Cyberpunk yellow */
            font-weight: bold;
            text-shadow: 3px 3px 0 #000;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px 40px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">Score: 0</div>
    <div id="uiOverlay">
        <div id="message">PRESS SPACE OR CLICK TO FLY</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiMessage = document.getElementById('message');
        const scoreBoard = document.getElementById('scoreBoard');

        // Make canvas fill the screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game Variables
        let frames = 0;
        let score = 0;
        let gameActive = false;
        let obstacles = [];

        // The Plane Object
        const plane = {
            x: window.innerWidth * 0.15,
            y: canvas.height / 2,
            width: 50,
            height: 30,
            velocity: 0,
            gravity: 0.4,
            jumpPower: -8,
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Tilt the plane based on velocity (falling vs jumping)
                let rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.05)));
                ctx.rotate(rotation);

                // Draw Plane Body (Neon Red)
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.moveTo(0, 10);
                ctx.lineTo(40, 10);
                ctx.lineTo(50, 20); // Nose
                ctx.lineTo(40, 30);
                ctx.lineTo(0, 30);
                ctx.closePath();
                ctx.fill();

                // Draw Wing (White)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(15, 20);
                ctx.lineTo(25, 0);
                ctx.lineTo(35, 20);
                ctx.fill();

                // Draw Window Detail (Dark)
                ctx.fillStyle = '#2f3542';
                ctx.fillRect(35, 12, 8, 6);

                ctx.restore();
            },
            
            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;
            }
        };

        // Handle the towers/obstacles
        function handleObstacles() {
            // Add new obstacles every 90 frames
            if (frames % 90 === 0) {
                let gap = 220; // Space between top and bottom towers
                let minHeight = 50;
                let topHeight = Math.random() * (canvas.height - gap - minHeight * 2) + minHeight;
                
                // Top Tower
                obstacles.push({
                    x: canvas.width,
                    y: 0,
                    width: 60,
                    height: topHeight,
                    passed: false
                });
                
                // Bottom Tower
                obstacles.push({
                    x: canvas.width,
                    y: topHeight + gap,
                    width: 60,
                    height: canvas.height - topHeight - gap
                });
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= 5; // Game speed (moving left)

                // Draw Obstacle (Neon Blue)
                ctx.fillStyle = '#1e90ff';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                // Add a cool border to towers
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                // Collision Detection (Box collision)
                if (
                    plane.x < obs.x + obs.width &&
                    plane.x + plane.width > obs.x &&
                    plane.y < obs.y + obs.height &&
                    plane.y + plane.height > obs.y
                ) {
                    gameOver();
                }

                // Update Score (Only check the top tower so we don't double count)
                if (obs.y === 0 && obs.x + obs.width < plane.x && !obs.passed) {
                    score++;
                    obs.passed = true;
                    scoreBoard.innerText = "Score: " + score;
                }
            }

            // Remove obstacles that have gone off-screen to save memory
            if (obstacles.length > 0 && obstacles[0].x < -100) {
                obstacles.shift(); // Remove top
                obstacles.shift(); // Remove bottom
            }
        }

        // Main Game Loop
        function animate() {
            if (!gameActive) return;
            
            // Clear the screen for the next frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            plane.draw();
            plane.update();
            handleObstacles();

            // Floor or Ceiling Crash
            if (plane.y + plane.height >= canvas.height || plane.y <= 0) {
                gameOver();
            }

            frames++;
            requestAnimationFrame(animate); // Loop the animation
        }

        function gameOver() {
            gameActive = false;
            uiMessage.innerText = "CRASHED! CLICK TO RESTART";
            uiMessage.style.display = "block";
        }

        function triggerJump() {
            if (!gameActive) {
                // Reset Game State
                plane.y = canvas.height / 2;
                plane.velocity = 0;
                obstacles = [];
                score = 0;
                frames = 0;
                scoreBoard.innerText = "Score: 0";
                uiMessage.style.display = "none";
                gameActive = true;
                animate(); // Start the loop
            }
            // Apply upward force
            plane.velocity = plane.jumpPower;
        }

        // Controls (Mouse click, Touch, or Spacebar)
        window.addEventListener('mousedown', triggerJump);
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Stop screen from scrolling on mobile
            triggerJump();
        });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                triggerJump();
            }
        });

        // Handle window resizing
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (!gameActive) {
                plane.y = canvas.height / 2;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                plane.draw();
            }
        });
        
        // Draw the plane on the start screen before the game begins
        plane.draw();

    </script>
</body>
</html>
