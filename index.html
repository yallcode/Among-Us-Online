<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Games Menu</title>
    <style>
        /* Clean, modern, non-vibecore styling */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .menu-container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }
        h1 {
            margin-top: 0;
            font-size: 32px;
            color: #2c3e50;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 40px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-space {
            background-color: #2c3e50;
        }
        .btn-space:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>Flight Simulators</h1>
        <p>Select your environment</p>
        
        <a href="plane.html" class="btn">✈️ Earth Atmosphere</a>
        <a href="rocket.html" class="btn btn-space">🚀 Deep Space</a>
    </div>

</body>
</html>
