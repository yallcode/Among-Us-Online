<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plane</title>
    <style>
        /* Removes margins and scrollbars so the game fills the screen */
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #87CEEB; 
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none; /* Lets clicks pass through to the game */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    
    <div id="ui">Use WASD or Arrow Keys to move</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. SET UP THE SCENE
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue background

        // 2. SET UP THE CAMERA
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // 3. SET UP THE RENDERER
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. ADD LIGHTING
        // Ambient light for general brightness
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        // Directional light for shadows and depth
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 5. CREATE THE GROUND
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x228B22 }); // Forest green
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2; // Lay the plane flat
        scene.add(ground);

        // 6. CREATE THE PLAYER (A Red Cube)
        const playerGeo = new THREE.BoxGeometry(1, 1, 1);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.y = 0.5; // Rest exactly on top of the ground
        scene.add(player);

        // 7. INPUT HANDLING
        const keys = { 
            w: false, a: false, s: false, d: false, 
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false 
        };
        
        // Keep track of which keys are currently pressed down
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        
        // Keep track of when keys are released
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Make sure the game resizes if the browser window changes
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // 8. THE GAME LOOP
        const speed = 0.15; // Player movement speed

        function animate() {
            // Tell the browser to call this function on the next frame
            requestAnimationFrame(animate);

            // Update player position based on keys pressed
            if (keys.w || keys.ArrowUp) player.position.z -= speed;
            if (keys.s || keys.ArrowDown) player.position.z += speed;
            if (keys.a || keys.ArrowLeft) player.position.x -= speed;
            if (keys.d || keys.ArrowRight) player.position.x += speed;

            // Make the camera follow the player smoothly
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 5;
            camera.position.z = player.position.z + 8;
            camera.lookAt(player.position); // Always stare at the player

            // Draw the scene
            renderer.render(scene, camera);
        }

        // Start the loop!
        animate();
    </script>
</body>
</html>
