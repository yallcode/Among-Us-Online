<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D WebGL Flyer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            font-family: 'Courier New', Courier, monospace;
            background-color: #87CEEB;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
    <!-- Import the Three.js 3D library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">Score: <span id="scoreVal">0</span></div>
    <div id="instructions">USE ARROW KEYS OR W/A/S/D TO FLY</div>

    <script>
        // 1. Setup the Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue background
        scene.fog = new THREE.Fog(0x87CEEB, 100, 400); // Fades objects in the distance

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 30); // Position camera slightly above and behind the plane

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 100, 50);
        scene.add(dirLight);

        // 3. Build the 3D Plane
        const plane = new THREE.Group();

        // Fuselage (Body)
        const bodyGeo = new THREE.BoxGeometry(2, 2, 10);
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0xff3333 }); // Red
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        plane.add(body);

        // Wings
        const wingGeo = new THREE.BoxGeometry(14, 0.4, 3);
        const wingMat = new THREE.MeshPhongMaterial({ color: 0xffffff }); // White
        const wing = new THREE.Mesh(wingGeo, wingMat);
        wing.position.set(0, 0, 1);
        plane.add(wing);

        // Tail
        const tailGeo = new THREE.BoxGeometry(0.5, 3, 2);
        const tail = new THREE.Mesh(tailGeo, wingMat);
        tail.position.set(0, 1.5, 4);
        plane.add(tail);

        scene.add(plane);

        // 4. Create Obstacles (Clouds/Blocks to fly past)
        const obstacles = [];
        const obstacleCount = 60;
        const obstacleGeo = new THREE.BoxGeometry(4, 4, 4);
        const obstacleMat = new THREE.MeshPhongMaterial({ color: 0x33dd33 }); // Green

        for (let i = 0; i < obstacleCount; i++) {
            const obs = new THREE.Mesh(obstacleGeo, obstacleMat);
            
            // Randomly position them in a tunnel shape far away
            obs.position.x = (Math.random() - 0.5) * 80;
            obs.position.y = (Math.random() - 0.5) * 60;
            obs.position.z = -Math.random() * 500 - 50; 
            
            scene.add(obs);
            obstacles.push(obs);
        }

        // 5. Controls & Physics Variables
        let speed = 1.5; // How fast the world moves towards you
        let score = 0;
        
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            w: false, s: false, a: false, d: false
        };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
                keys[e.key.toLowerCase() || e.key] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
                keys[e.key.toLowerCase() || e.key] = false;
            }
        });

        // 6. The Animation Loop (Runs every frame)
        function animate() {
            requestAnimationFrame(animate);

            // Move the plane based on input
            if ((keys.ArrowUp || keys.w) && plane.position.y < 25) plane.position.y += 0.5;
            if ((keys.ArrowDown || keys.s) && plane.position.y > -25) plane.position.y -= 0.5;
            if ((keys.ArrowLeft || keys.a) && plane.position.x > -35) plane.position.x -= 0.5;
            if ((keys.ArrowRight || keys.d) && plane.position.x < 35) plane.position.x += 0.5;

            // Make the plane "bank" or tilt when steering for a cool 3D effect
            const targetRotationZ = ((keys.ArrowRight || keys.d) ? -0.5 : 0) + ((keys.ArrowLeft || keys.a) ? 0.5 : 0);
            const targetRotationX = ((keys.ArrowUp || keys.w) ? -0.2 : 0) + ((keys.ArrowDown || keys.s) ? 0.2 : 0);
            
            // Smoothly interpolate current rotation to target rotation
            plane.rotation.z += (targetRotationZ - plane.rotation.z) * 0.1;
            plane.rotation.x += (targetRotationX - plane.rotation.x) * 0.1;

            // Move obstacles towards the camera to simulate forward movement
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].position.z += speed;

                // Simple Box Collision Detection
                if (
                    Math.abs(plane.position.x - obstacles[i].position.x) < 3 &&
                    Math.abs(plane.position.y - obstacles[i].position.y) < 3 &&
                    Math.abs(plane.position.z - obstacles[i].position.z) < 5
                ) {
                    // Crash reset
                    score = 0;
                    document.getElementById('scoreVal').innerText = score;
                    document.getElementById('instructions').innerText = "CRASHED! RESTARTING...";
                    document.getElementById('instructions').style.color = "red";
                    
                    setTimeout(() => {
                        document.getElementById('instructions').innerText = "USE ARROW KEYS OR W/A/S/D TO FLY";
                        document.getElementById('instructions').style.color = "white";
                    }, 1000);

                    // Reset obstacle position
                    obstacles[i].position.z = -500;
                }

                // If obstacle goes behind the camera, recycle it and increase score
                if (obstacles[i].position.z > 40) {
                    obstacles[i].position.z = -500;
                    obstacles[i].position.x = (Math.random() - 0.5) * 80;
                    obstacles[i].position.y = (Math.random() - 0.5) * 60;
                    
                    score++;
                    document.getElementById('scoreVal').innerText = score;
                    
                    // Gradually increase speed for difficulty
                    speed += 0.001; 
                }
            }

            renderer.render(scene, camera);
        }

        // Handle window resizing
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // Start the game loop
        animate();
    </script>
</body>
</html>
