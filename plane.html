<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Plane WebGL Flyer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        .ui-layer {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        #scoreBoard { color: white; font-weight: bold; font-size: 24px; text-shadow: 1px 1px 3px black; }
        .back-btn {
            pointer-events: auto; background: white; color: black; padding: 10px 20px;
            text-decoration: none; font-weight: bold; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #instructions {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: white; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 3px black; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="ui-layer">
        <div id="scoreBoard">Score: <span id="scoreVal">0</span></div>
        <a href="index.html" class="back-btn">Main Menu</a>
    </div>
    <div id="instructions">USE ARROW KEYS OR W/A/S/D TO FLY</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.005); // Smoother distance fading

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);

        // Enable shadows in the renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Upgraded Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        scene.add(dirLight);

        // Add a Ground with a Grid for depth perception
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x4b7b4b });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -30;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(1000, 100, 0x000000, 0x000000);
        gridHelper.position.y = -29.9;
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // Build the 3D Plane
        const plane = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(2, 2, 10);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        plane.add(body);

        const wingGeo = new THREE.BoxGeometry(14, 0.4, 3);
        const wingMat = new THREE.MeshLambertMaterial({ color: 0xecf0f1 });
        const wing = new THREE.Mesh(wingGeo, wingMat);
        wing.position.set(0, 0, 1);
        wing.castShadow = true;
        plane.add(wing);

        const tailGeo = new THREE.BoxGeometry(0.5, 3, 2);
        const tail = new THREE.Mesh(tailGeo, wingMat);
        tail.position.set(0, 1.5, 4);
        tail.castShadow = true;
        plane.add(tail);

        scene.add(plane);

        // Obstacles
        const obstacles = [];
        const obstacleCount = 60;
        const obstacleGeo = new THREE.BoxGeometry(5, 5, 5);
        const obstacleMat = new THREE.MeshLambertMaterial({ color: 0xf1c40f });

        for (let i = 0; i < obstacleCount; i++) {
            const obs = new THREE.Mesh(obstacleGeo, obstacleMat);
            obs.position.x = (Math.random() - 0.5) * 80;
            obs.position.y = (Math.random() - 0.5) * 60;
            obs.position.z = -Math.random() * 500 - 50; 
            obs.castShadow = true;
            obs.receiveShadow = true;
            scene.add(obs);
            obstacles.push(obs);
        }

        let speed = 1.5;
        let score = 0;
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };

        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase() || e.key)) keys[e.key.toLowerCase() || e.key] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key.toLowerCase() || e.key)) keys[e.key.toLowerCase() || e.key] = false; });

        function animate() {
            requestAnimationFrame(animate);

            if ((keys.ArrowUp || keys.w) && plane.position.y < 25) plane.position.y += 0.5;
            if ((keys.ArrowDown || keys.s) && plane.position.y > -25) plane.position.y -= 0.5;
            if ((keys.ArrowLeft || keys.a) && plane.position.x > -35) plane.position.x -= 0.5;
            if ((keys.ArrowRight || keys.d) && plane.position.x < 35) plane.position.x += 0.5;

            plane.rotation.z += ((((keys.ArrowRight || keys.d) ? -0.5 : 0) + ((keys.ArrowLeft || keys.a) ? 0.5 : 0)) - plane.rotation.z) * 0.1;
            plane.rotation.x += ((((keys.ArrowUp || keys.w) ? -0.2 : 0) + ((keys.ArrowDown || keys.s) ? 0.2 : 0)) - plane.rotation.x) * 0.1;

            // Move ground grid to simulate infinite forward motion
            gridHelper.position.z += speed;
            if (gridHelper.position.z > 10) gridHelper.position.z = 0;

            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].position.z += speed;
                obstacles[i].rotation.x += 0.01;
                obstacles[i].rotation.y += 0.01;

                if (Math.abs(plane.position.x - obstacles[i].position.x) < 3.5 &&
                    Math.abs(plane.position.y - obstacles[i].position.y) < 3.5 &&
                    Math.abs(plane.position.z - obstacles[i].position.z) < 5) {
                    
                    score = 0; speed = 1.5;
                    document.getElementById('scoreVal').innerText = score;
                    obstacles[i].position.z = -500;
                }

                if (obstacles[i].position.z > 40) {
                    obstacles[i].position.z = -500;
                    obstacles[i].position.x = (Math.random() - 0.5) * 80;
                    obstacles[i].position.y = (Math.random() - 0.5) * 60;
                    score++; speed += 0.002;
                    document.getElementById('scoreVal').innerText = score;
                }
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); });
        animate();
    </script>
</body>
</html>
